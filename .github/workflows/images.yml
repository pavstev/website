name: Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - public/fonts/inter-*
      - public/fonts/parkinsans-*
      - public/portraits/portrait-800.webp
      - scripts/generate-images.ts
      - src/lib/i18n.ts
      - src/lib/icon-data.ts
      - src/lib/personal.ts
      - src/lib/sky-shader.ts
      - src/lib/theme.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: images-sync

jobs:
  generate:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-images.ts
      - name: Commit and push
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain public/og-image.jpg public/linkedin-cover.png)" ]; then
            echo "Nothing changed. The images are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image.jpg public/linkedin-cover.png
          git commit -m "chore(images): refresh the social images"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pushed the new images." >> "$GITHUB_STEP_SUMMARY"
      - name: Report the failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create images-sync --color B60205 --description "The images workflow failed" --force
          body="The social images failed ($GITHUB_EVENT_NAME): $RUN_URL"
          issue="$(gh issue list --label images-sync --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Social images failed" --label images-sync --body "$body"
          fi
      - name: Close the failure report
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label images-sync --state open --json number --jq '.[].number' | while read -r issue; do
            gh issue close "$issue" --comment "The social images work again: $RUN_URL"
          done
