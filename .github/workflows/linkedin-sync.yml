name: LinkedIn

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linkedin-sync.yml
      - .nvmrc
      - public/linkedin-cover.png
      - public/portraits/portrait-800.webp
      - public/stevan-pavlovic.jpeg
      - scripts/linkedin-sync.ts
      - src/lib/cv.ts
      - src/lib/i18n.ts
      - src/lib/linkedin-fields.ts
      - src/lib/personal.ts
      - src/lib/products.ts
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Print the issue it would write and change nothing
        type: boolean

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: linkedin-sync

jobs:
  sync:
    permissions:
      actions: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Load the last snapshot
        id: state
        run: |
          echo "OUT=$RUNNER_TEMP/linkedin" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/linkedin"
          mkdir -p "$OUT"
          gh label create linkedin-state --color EDEDED --description "The last snapshot the LinkedIn sync reported" --force
          gh label create linkedin-sync --color 0A66C2 --description "LinkedIn needs a manual update" --force
          number="$(gh issue list --label linkedin-state --state all --limit 1 --json number --jq '.[0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > "$OUT/previous.md"
          else
            : > "$OUT/previous.md"
          fi
      - name: Compare with the site
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--previous "$OUT/previous.md" --ref "$GITHUB_SHA")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
            node scripts/linkedin-sync.ts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/linkedin-sync.ts "${args[@]}" --out "$OUT"
          fi
      - name: Tell the owner
        if: github.ref == 'refs/heads/main' && !inputs.dry_run
        run: |
          status="$(cat "$OUT/status")"
          if [ "$status" = "same" ]; then
            echo "LinkedIn already matches the site. Nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open="$(gh issue list --label linkedin-sync --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$OUT/body.md"
            echo "Added a comment to issue #$open." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$(cat "$OUT/title.txt")" --label linkedin-sync --body-file "$OUT/body.md"
            echo "Opened a LinkedIn issue ($status)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the snapshot
        if: github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          STATE_NUMBER: ${{ steps.state.outputs.number }}
        run: |
          if [ "$(cat "$OUT/status")" = "same" ]; then
            exit 0
          fi
          if [ -n "$STATE_NUMBER" ]; then
            gh issue edit "$STATE_NUMBER" --body-file "$OUT/state.md"
          else
            url="$(gh issue create --title "LinkedIn sync state (do not edit)" --label linkedin-state --body-file "$OUT/state.md")"
            number="${url##*/}"
            gh issue close "$number"
            gh issue lock "$number" --reason resolved
          fi
          echo "Saved the new snapshot." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/linkedin-sync.yml/enable"
      - name: Report the failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create linkedin-sync-failed --color B60205 --description "The LinkedIn sync workflow failed" --force
          body="The LinkedIn sync failed ($GITHUB_EVENT_NAME): $RUN_URL"
          issue="$(gh issue list --label linkedin-sync-failed --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "LinkedIn sync failed" --label linkedin-sync-failed --body "$body"
          fi
      - name: Close the failure report
        if: success() && github.ref == 'refs/heads/main'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label linkedin-sync-failed --state open --json number --jq '.[].number' | while read -r issue; do
            gh issue close "$issue" --comment "The LinkedIn sync works again: $RUN_URL"
          done
