name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - content/blog/**

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: indexnow

jobs:
  notify:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Wait for the deploy, then tell IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node scripts/indexnow.ts --sha "$SHA" --before "$BEFORE"
      - name: Report the failure
        if: failure()
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create indexnow-failed --color B60205 --description "The IndexNow workflow failed" --force
          body="IndexNow failed for ${GITHUB_SHA}: $RUN_URL"
          issue="$(gh issue list --label indexnow-failed --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "IndexNow failed" --label indexnow-failed --body "$body"
          fi
      - name: Close the failure report
        if: success()
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label indexnow-failed --state open --json number --jq '.[].number' | while read -r issue; do
            gh issue close "$issue" --comment "IndexNow works again: $RUN_URL" || echo "Could not close issue $issue" >> "$GITHUB_STEP_SUMMARY"
          done || echo "Could not list the IndexNow issues" >> "$GITHUB_STEP_SUMMARY"
