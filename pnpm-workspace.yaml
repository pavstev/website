allowBuilds:
  esbuild: true
  lefthook: true
  sharp: false
  unrs-resolver: false
  workerd: true
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 1440
overrides:
  yaml@>=2.0.0 <2.8.3: ">=2.8.3"
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
verifyDepsBeforeRun: install
savePrefix: "^"
